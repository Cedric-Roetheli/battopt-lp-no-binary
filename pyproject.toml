[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battopt-lp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PuLP>=2.8",
  "typer>=0.12",
  "PyYAML>=6.0",
  "matplotlib>=3.8"   # <— hinzufügen
]


[tool.setuptools.packages.find]
include = ["battopt_lp*"]
